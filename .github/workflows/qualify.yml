name: Security qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: secrets
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate release tag before qualification
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node scripts/check-release.ts
      - id: host
        name: Read immutable host pin
        run: node -e 'const p=JSON.parse(require("fs").readFileSync("host-compatibility.json","utf8"));if(!/^[a-f0-9]{40}$/.test(p.revision))process.exit(1);require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`repository=${p.repository}\nrevision=${p.revision}\n`)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.host.outputs.repository }}
          ref: ${{ steps.host.outputs.revision }}
          path: or3-chat
          persist-credentials: false
      - name: Frozen dependencies without lifecycle scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cd ../or3-chat
          bun install --frozen-lockfile --ignore-scripts
      - name: Build, types and real process regressions
        run: |
          bun --no-env-file run build
          bun --no-env-file run typecheck
          bun --no-env-file run format:check
          mkdir -p test-results
          bun --no-env-file test --timeout 30000 --reporter=junit --reporter-outfile=test-results/tests.xml tests
          bun --no-env-file scripts/qualify-interruptions.ts
          bun --no-env-file scripts/qualify-profile.ts
      - name: Package and pinned provider qualification
        run: |
          bun --no-env-file scripts/qualify.ts
          bun --no-env-file scripts/qualify-operator.ts
          bun --no-env-file scripts/qualify-provider.ts
          bun audit --json > test-results/dependency-audit.json
      - name: Linux custody and bounded disk-full qualification
        run: |
          docker build -f scripts/Qualification.Dockerfile -t or3-secrets-qualification:ci .
          docker run --rm --network none --user 0 --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add KILL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 -v "$PWD:/work:ro" -v "$PWD/test-results:/receipts" or3-secrets-qualification:ci sh scripts/qualify-isolation.sh
          docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=8m,mode=1777 --tmpfs "/staging:rw,nosuid,nodev,size=128m,mode=700,uid=$(id -u),gid=$(id -g)" -v "$PWD:/work:ro" -v "$PWD/test-results:/receipts" or3-secrets-qualification:ci bun --no-env-file scripts/qualify-disk.ts
          if docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges -v "$PWD:/work:ro" or3-secrets-qualification:ci bun --no-env-file scripts/qualify-disk.ts; then
            echo 'Disk qualifier unexpectedly accepted ordinary storage' >&2
            exit 1
          fi
          docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 -v "$PWD:/work:ro" -v "$PWD/test-results:/work/test-results" or3-secrets-qualification:ci bun --no-env-file scripts/qualify-linux.ts
      - name: Linux mixed inventory and exact capacity recovery
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 -v "$PWD:/work:ro" -v "$PWD/test-results:/work/test-results" or3-secrets-qualification:ci sh -c 'bun --no-env-file scripts/qualify-profile.ts && cp test-results/profile.json test-results/profile-linux.json'
          baseline="$(mktemp -d)"
          trap 'rm -rf "$baseline"' EXIT
          git archive 0888b45cea9428e9daf769a976b45d082187c3e1 src | tar -xf - -C "$baseline"
          docker run --rm --network none --memory 1g --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges -e CI=true -e OR3_SECRETS_CAPACITY_BASELINE=/baseline -v "$baseline:/baseline:ro" -v "$PWD:/work:ro" -v "$PWD/test-results:/work/test-results" or3-secrets-qualification:ci bun --no-env-file scripts/qualify-capacity.ts
      - name: Full-source secret scan
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD:/source:ro" -v "$PWD/test-results:/results"
          aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          --cache-dir /tmp/trivy fs --scanners secret --offline-scan --skip-version-check --exit-code 1
          --skip-dirs /source/node_modules --skip-dirs /source/.git
          --skip-dirs /source/dist --skip-dirs /source/test-results
          --secret-config /source/trivy-secret.yaml --format json
          --output /results/source-secret-scan.json /source
      - name: Record runtime inventory and OS advisories
        run: |
          bun --no-env-file -e 'import {Database} from "bun:sqlite"; import {writeFileSync} from "node:fs"; const node=JSON.parse(Bun.spawnSync(["node","-e","process.stdout.write(JSON.stringify(process.versions))"]).stdout.toString()); writeFileSync("test-results/runtime-inventory.json",JSON.stringify({bun:Bun.version,sqlite:new Database(":memory:").query("select sqlite_version() as version").get(),node,platform:process.platform,architecture:process.arch},null,2))'
          docker save --output test-results/runtime-image.tar or3-secrets-qualification:ci
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges -v "$PWD/test-results/runtime-image.tar:/image.tar:ro" -v "$PWD/test-results:/results" aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e --cache-dir /tmp/trivy image --input /image.tar --scanners vuln --skip-version-check --no-progress --format json --output /results/runtime-image-scan.json
          node -e 'const r=require("./test-results/runtime-image-scan.json");const v=r.Results.flatMap(x=>x.Vulnerabilities??[]);const n=v.filter(x=>["HIGH","CRITICAL"].includes(x.Severity)).length;if(n)console.log(`::warning::${n} high/critical OS package findings require review before production; qualification success is not runtime security approval`)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: qualification-${{ github.sha }}
          path: |
            secrets/test-results/*.json
            secrets/test-results/*.xml
            secrets/test-results/*.tgz
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Saluana/or3-secrets'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualification-${{ github.sha }}
          path: test-results
      - name: Verify exact qualified artifact and unused version
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          node scripts/check-release.ts test-results
      - name: Publish qualified tarball with npm trusted publishing
        run: |
          artifact="$(node -p 'JSON.parse(require("fs").readFileSync("test-results/package-receipt.json", "utf8")).artifact')"
          npm publish "./test-results/$artifact" --access public --provenance --ignore-scripts
